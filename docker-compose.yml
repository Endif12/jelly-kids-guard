services:
  jelly-kids-guard:
    # Ugreen NAS Docker -> Project -> Create project, paste this file (no SSH needed)
    image: ghcr.io/endif12/jelly-kids-guard:latest
    container_name: jelly-kids-guard
    restart: unless-stopped
    ports:
      - "35325:8080"
    volumes:
      # Change left side to your NAS shared folder (create it first)
      - ./app_config:/app/data
    environment:
      - TZ=Asia/Shanghai
